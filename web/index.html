<!doctype html>
<html lang="en" data-theme="radar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deposit Radar shows banks, credit unions and wealth firms where their customers' money is going before it leaves, so relationship teams can act first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Deposit Radar | See deposit runoff before it happens</title>
    <script>
      try {
        var t = localStorage.getItem('dr-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'radar-dark' : 'radar';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
