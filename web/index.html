<!doctype html>
<html lang="en" data-theme="aggregateiq-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AggregateIQ | Financial Data Aggregation for Banks &amp; CUs</title>
    <meta name="description" content="See the deposits your members hold elsewhere. AggregateIQ helps banks, credit unions and wealth firms recover deposits, grow share of wallet and prove ROI." />
    <link rel="canonical" href="https://www.aggregateiq.example/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AggregateIQ" />
    <meta property="og:title" content="AggregateIQ | Financial Data Aggregation for Banks &amp; CUs" />
    <meta property="og:description" content="See the deposits your members hold elsewhere. AggregateIQ helps banks, credit unions and wealth firms recover deposits, grow share of wallet and prove ROI." />
    <meta property="og:url" content="https://www.aggregateiq.example/" />
    <meta property="og:image" content="https://www.aggregateiq.example/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AggregateIQ | Financial Data Aggregation for Banks &amp; CUs" />
    <meta name="twitter:description" content="See the deposits your members hold elsewhere. Recover deposits, grow share of wallet and prove ROI." />
    <meta name="twitter:image" content="https://www.aggregateiq.example/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('aiq-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'aggregateiq-dark' : 'aggregateiq-light');
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "AggregateIQ",
            "url": "https://www.aggregateiq.example/",
            "logo": "https://www.aggregateiq.example/favicon.svg"
          },
          {
            "@type": "Product",
            "name": "AggregateIQ Growth Platform",
            "description": "Financial data aggregation platform that gives banks, credit unions and wealth management firms a 360-degree view of customer finances, including held-away deposits and assets.",
            "brand": { "@type": "Brand", "name": "AggregateIQ" },
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "2500",
              "offerCount": "3"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Can we change plans later?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can move between Community and Growth at any renewal, and upgrade mid-term at a prorated rate as your connected-user count grows." }
              },
              {
                "@type": "Question",
                "name": "What is included in the 90-day pilot?",
                "acceptedAnswer": { "@type": "Answer", "text": "Full platform access for an opt-in member cohort, core and digital banking integration, a held-away deposit report, and a dedicated success manager. If the pilot does not identify at least $25M in recoverable deposits and assets, your setup fee is refunded." }
              },
              {
                "@type": "Question",
                "name": "Do you offer pricing for smaller institutions?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Community plan is built for credit unions and community banks under $500M in assets, and we offer consortium pricing for CUSOs and league partners." }
              },
              {
                "@type": "Question",
                "name": "Is pricing affected by the number of connected users?",
                "acceptedAnswer": { "@type": "Answer", "text": "Each plan includes a connected-user allowance. Above it, usage is billed at $0.35 per active connected user per month. Enterprise plans carry custom volume pricing." }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
